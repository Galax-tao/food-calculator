<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Calculator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6eb;--ac:#0f766e;--acbg:#e0f2f1;--p:#2563eb;--f:#d97706;--c:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181d24;--tx:#eef1f5;--mu:#98a2b3;--bd:#2a313b;--ac:#2dd4bf;--acbg:#12312f;--p:#60a5fa;--f:#fbbf24;--c:#a78bfa}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181d24;--tx:#eef1f5;--mu:#98a2b3;--bd:#2a313b;--ac:#2dd4bf;--acbg:#12312f;--p:#60a5fa;--f:#fbbf24;--c:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tot{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:20px}
.grid span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.k b{color:var(--ac)}.p b{color:var(--p)}.f b{color:var(--f)}.c b{color:var(--c)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:4px 10px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item.sel{border-color:var(--ac);background:var(--acbg)}
.info{min-width:0}
.nm{font-weight:600}
.sv{font-size:12px;color:var(--mu)}
.mc{font-size:12px;margin-top:2px}
.mc i{font-style:normal;margin-right:8px}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;line-height:1}
.step span{min-width:28px;text-align:center;font-weight:600}
.note{font-size:12px;color:var(--mu);margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Food Calculator</h1>
<div class="tot">
  <div class="grid">
    <div class="k"><b id="tk">0</b><span>kcal</span></div>
    <div class="p"><b id="tp">0</b><span>Protein g</span></div>
    <div class="f"><b id="tf">0</b><span>Fat g</span></div>
    <div class="c"><b id="tc">0</b><span>Carbs g</span></div>
  </div>
  <div class="row2"><span id="cnt">Nothing selected</span><button class="reset" onclick="resetAll()">Reset</button></div>
</div>
<input type="search" id="q" placeholder="Search food…" oninput="render()">
<div class="chips" id="chips"></div>
<div id="list"></div>
<p class="note">Values are per serving, from your Food sheet. Ranges use the midpoint; “negligible” counts as 0. FarmFresh Brown Sugar Soy Milk shows 7.8 g for every macro in the sheet, so double-check that row.</p>
</div>
<script>
// [type, name, serving, kcal, protein, fat, carbs]
const F=[
["Carbs","Cavendish Banana","1 piece, ~100g",90.5,1.1,0.3,22.8],
["Carbs","Chipmores Double Choc Cookies","5 pieces, 36g",176,2.2,8.3,22.5],
["Carbs","Chipmores Cookies Handy Pack","24g serving (3 per pack)",354,4.2,16.8,45],
["Carbs","Kawan Roti Prata","1 piece",287,4.2,12.9,35.3],
["Carbs","Lotus Australian Rolled Oats","1 serving, 35g",134,4.1,3.3,20.2],
["Carbs","Arab Honey","1 tbsp, 21g",64,0,0,17.3],
["Carbs","Wagyu Flavoured Potato Wedges","50g",300,2.9,18.5,27.5],
["Fiber","Broccoli","100g",34,2.8,0.4,6.6],
["Fiber","Cucumber","1 piece, ~100-150g",15,0,0,3],
["Fiber","Tomato","1 piece, ~100g",18,0.9,0.2,3.9],
["Protein","Egg","1 piece",75,6.3,4.8,0.36],
["Protein","Tuna in Spring Water","1 can, 110g",122,29.2,0.6,0],
["Protein","Dutch Lady Lowfat Milk","200ml",88,5.2,2.4,11.4],
["Protein","FarmFresh Brown Sugar Soy Milk","200ml",116.4,7.8,7.8,7.8],
["Protein","FarmFresh High Protein Choco Milk","200ml",166.4,10,4.8,20.8],
["Protein","Goodday Lowfat Milk","200ml",98,6.8,2.8,11.2],
["Protein","HL Advanced Milk","250ml",140,12.5,2.3,17.5],
["Protein","HL Original Milk","200ml",108,8.4,2,14],
["Protein","Nestle Omega Plus Milk","200ml",100,6.2,3.6,11],
["Protein","Nobo Soymilk","180ml",104,7.6,1.1,9.4],
["Protein","V-Soy Soy Milk","250ml",160,7.8,7.8,14],
["Protein","Yarra FarmFresh Milk","200ml",128.6,6.4,7,10],
["Protein","Yeo’s Soy Milk","250ml",98,5,2.8,12.8],
["Sweet","Kangshifu Jasmine Tea","100ml",18,0,0,4.2],
["Sweet","Matkool Icy Grape","1 stick",39,0,0,10]
];
const qty=F.map(()=>0);let cat="All";
const cats=["All","Selected",...new Set(F.map(x=>x[0]))];
const r1=n=>Math.round(n*10)/10;
function chips(){document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" onclick="setCat('${c}')">${c}</button>`).join("")}
function setCat(c){cat=c;chips();render()}
function chg(i,d){qty[i]=Math.max(0,r1(qty[i]+d));render()}
function resetAll(){qty.fill(0);render()}
function render(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  let h="";
  F.forEach((x,i)=>{
    if(cat==="Selected"?qty[i]===0:(cat!=="All"&&x[0]!==cat))return;
    if(q&&!x[1].toLowerCase().includes(q))return;
    h+=`<div class="item${qty[i]?" sel":""}"><div class="info"><div class="nm">${x[1]}</div><div class="sv">${x[2]}</div>
    <div class="mc"><i>${x[3]} kcal</i><i style="color:var(--p)">P ${x[4]}</i><i style="color:var(--f)">F ${x[5]}</i><i style="color:var(--c)">C ${x[6]}</i></div></div>
    <div class="step"><button onclick="chg(${i},-0.5)" aria-label="less">−</button><span>${qty[i]}</span><button onclick="chg(${i},0.5)" aria-label="more">+</button></div></div>`;
  });
  document.getElementById("list").innerHTML=h||'<p class="note">No matches.</p>';
  let t=[0,0,0,0],n=0;
  F.forEach((x,i)=>{if(qty[i]){n++;for(let k=0;k<4;k++)t[k]+=x[k+3]*qty[i]}});
  ["tk","tp","tf","tc"].forEach((id,k)=>document.getElementById(id).textContent=r1(t[k]));
  document.getElementById("cnt").textContent=n?n+" item"+(n>1?"s":"")+" selected (0.5 serving steps)":"Nothing selected";
}
chips();render();
</script>
</body>
</html>
